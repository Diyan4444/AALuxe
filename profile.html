<script src="script.js"></script>
<script>
  // Pull authenticated data parameters locally and inject into display layers
  const userData = JSON.parse(localStorage.getItem('aaluxe_user'));
  if (userData) {
    document.getElementById('profileName').textContent = userData.name;
    document.getElementById('profileEmail').textContent = userData.email;
  }

  function logoutUser() {
    if (confirm("Are you sure you want to sign out?")) {
      localStorage.removeItem('aaluxe_user');
      window.location.href = "login.html";
    }
  }
  
  // Keep cart/favorite count badges uniform on page draw
  if (typeof updateBadges === 'function') {
    updateBadges();
  }
</script>
