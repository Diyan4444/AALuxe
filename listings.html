<!-- ─── PARALLAX HEADER ────────────────────────────────────── -->
<div class="page-header parallax-header" id="listingsParallaxHeader">
  <div class="parallax-overlay"></div>
  <div class="container header-content">
    <p class="page-eyebrow">AALUXE Collection</p>

  </div>
</div>

<div class="listings-layout container">
  <!-- SIDEBAR FILTERS -->
  <aside class="filters-sidebar" id="filtersSidebar">
    <div class="filters-header">
      <h3>Filter</h3>
      <button class="clear-filters" onclick="clearFilters()">Clear all</button>
    </div>

    <div class="filter-group">
      <label class="filter-label">Property Type</label>
      <div class="filter-checks" id="dynamicTypeChecks">
        <!-- Managed Types Rendered Dynamically -->
      </div>
    </div>

    <div class="filter-group">
      <label class="filter-label">Location</label>
      <select id="locationFilter" onchange="applyFilters()">
        <option value="">All Locations</option>
        <!-- Managed Locations Rendered Dynamically -->
      </select>
    </div>

    <button class="btn-gold" style="width:100%;margin-top:8px" onclick="applyFilters()">Apply Filters</button>
  </aside>

  <!-- MAIN GRID -->
  <main class="listings-main">
    <div class="search-wrapper">
      <div class="search-input-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="keywordSearch" class="listings-search-bar" placeholder="Search by hotel name..." oninput="applyFilters()">
      </div>
    </div>

    <div class="listings-topbar">
      <p id="resultsCount">Loading properties…</p>
      <button class="filter-toggle-btn" id="filterToggle" onclick="toggleFilters()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        Filters
      </button>
    </div>
    
    <div class="prop-grid" id="listingsGrid"></div>
    
    <div class="no-results hidden" id="noResults">
      <div class="no-results-icon">◇</div>
      <h3>No properties found</h3>
      <p>Try adjusting your filters or search keywords</p>
      <button class="btn-outline" onclick="clearFilters()">Clear Filters</button>
    </div>
  </main>
</div>

<script src="script.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDmHDMcsngn63fqO9ya-w60WoWl5m8Rl7k",
    authDomain: "aaluxe-1627d.firebaseapp.com",
    projectId: "aaluxe-1627d",
    storageBucket: "aaluxe-1627d.firebasestorage.app",
    messagingSenderId: "1005965760649",
    appId: "1:1005965760649:web:2c9817725f393988e30e58",
    measurementId: "G-MVBZQXC58M"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const activeUser = JSON.parse(localStorage.getItem('aaluxe_user'));
  const ADMIN_LIST = ['aaluxe0509@gmail.com', 'dailykarma1910@gmail.com'];

  if (activeUser && ADMIN_LIST.includes(activeUser.email)) {
    const consoleButton = document.getElementById('adminConsoleLink');
    if (consoleButton) consoleButton.style.display = 'block';
  }

  if (typeof updateBadges === 'function') updateBadges();

  window.clearFilters = function() {
    const checkboxes = document.querySelectorAll('.type-check');
    checkboxes.forEach(cb => cb.checked = false);
    
    const locFilter = document.getElementById('locationFilter');
    if (locFilter) locFilter.value = "";
    
    const searchBar = document.getElementById('keywordSearch');
    if (searchBar) searchBar.value = "";
    
    if (typeof applyFilters === 'function') applyFilters();
  }

  // Dynamic Live Taxonomy: Locations Mapping
  onSnapshot(collection(db, "locations"), (snapshot) => {
    const locFilter = document.getElementById('locationFilter');
    if (!locFilter) return;
    const currentVal = locFilter.value;
    locFilter.innerHTML = '<option value="">All Locations</option>';
    snapshot.forEach(doc => {
      const loc = doc.data().name;
      const option = document.createElement('option');
      option.value = loc;
      option.textContent = loc;
      locFilter.appendChild(option);
    });
    locFilter.value = currentVal;
  });

  // Dynamic Live Taxonomy: Stay Type Mapping
  onSnapshot(collection(db, "types"), (snapshot) => {
    const container = document.getElementById('dynamicTypeChecks');
    if (!container) return;
    container.innerHTML = '';
    snapshot.forEach(doc => {
      const type = doc.data().name;
      container.innerHTML += `<label><input type="checkbox" class="type-check" value="${type}" onchange="applyFilters()"> ${type}s</label>`;
    });
  });

  // Master Sync Execution Stream
  // =========================================================
  // LIVE PROPERTY LIST + PROPERTY COUNTER
  // =========================================================
  onSnapshot(collection(db, "properties"), (snapshot) => {
    const dynamicStays = [];
    snapshot.forEach(doc => {
      dynamicStays.push({
        id: doc.id,
        ...doc.data()
      });
    });

    // Store all properties globally
    window.allStaysData = dynamicStays;

    // TOTAL PROPERTY COUNTER
    const totalProperties = snapshot.size;
    if (typeof animatePropertyCount === 'function') {
      animatePropertyCount(totalProperties);
    }

    // READ URL FILTERS
    const urlParams = new URLSearchParams(window.location.search);
    const searchQuery = urlParams.get("search") ? urlParams.get("search").trim() : "";
    const typeParam = urlParams.get("type") ? urlParams.get("type").trim() : "";

    // APPLY URL FILTERS
    if (searchQuery || typeParam) {
      setTimeout(() => {
        if (searchQuery) {
          const searchBar = document.getElementById("keywordSearch");
          const locFilter = document.getElementById("locationFilter");

          const options = locFilter ? Array.from(locFilter.options) : [];
          const matchedOption = options.find(
            opt => opt.value.toLowerCase() === searchQuery.toLowerCase()
          );

          if (matchedOption) {
            locFilter.value = matchedOption.value;
          } else if (searchBar) {
            searchBar.value = searchQuery;
          }
        }

        if (typeParam) {
          const checks = document.querySelectorAll(".type-check");
          checks.forEach(cb => {
            if (cb.value.toLowerCase() === typeParam.toLowerCase()) {
              cb.checked = true;
            }
          });
        }

        if (typeof applyFilters === "function") {
          applyFilters();
        }
      }, 150);
    } else {
      if (typeof applyFilters === "function") {
        applyFilters();
      }
    }
  });
</script>

<script>
  // ─── LISTINGS PARALLAX SCROLL CONTROLLER ────────────────────
  window.addEventListener('scroll', () => {
    if (window.innerWidth <= 768) return;
    const header = document.getElementById('listingsParallaxHeader');
    if (!header) return;
    
    const rect = header.getBoundingClientRect();
    if (rect.bottom > 0) {
      const offset = window.scrollY * 0.25;
      header.style.backgroundPositionY = `calc(50% + ${offset}px)`;
      const content = header.querySelector('.header-content');
      if (content) {
        content.style.transform = `translateY(${offset * -0.2}px)`;
      }
    }
  }, { passive: true });
</script>
