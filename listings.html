      position: relative;

    .search-input-wrapper svg {

      width: 100%;

      border-color: #c5a880;

    /* ─── PARALLAX PAGE HEADER STYLES ────────────────────────── */

      background-size: cover;
      padding: 110px 0 90px;
      text-align: center;
      color: #ffffff;
      overflow: hidden;
      will-change: background-position;
    }

      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(17, 17, 17, 0.75) 0%, rgba(17, 17, 17, 0.6) 100%);
      z-index: 1;
    }
    .page-header .header-content {
      position: relative;
      z-index: 2;
      transition: transform 0.1s ease-out;
    }
    .page-header .page-eyebrow {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #c5a880;
      font-weight: 600;
      margin-bottom: 12px;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
    }
    .page-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 52px;
      font-weight: 400;
      color: #ffffff;
      letter-spacing: 1.5px;
      margin-bottom: 15px;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
    }
    .page-header .page-sub {
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      color: #f4ebd9;
      font-weight: 300;
      letter-spacing: 0.5px;
      max-width: 650px;
      margin: 0 auto;
      text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.7);
    }
    @media(max-width: 768px) {
      .page-header.parallax-header {
        padding: 80px 0 60px;
        background-attachment: scroll; /* Mobile smooth fallback */
      }
      .page-header h1 {
        font-size: 36px;
      }
      .page-header .page-sub {
        font-size: 13px;
        padding: 0 15px;
      }
    }
  </style>
</head>

<!-- ─── PARALLAX HEADER ────────────────────────────────────── -->
<div class="page-header parallax-header" id="listingsParallaxHeader">
  <div class="parallax-overlay"></div>
  <div class="container header-content">
    <p class="page-eyebrow">AALUXE Collection</p>
    <h1>All Stays</h1>
    <p class="page-sub">Handpicked luxury properties & exclusive retreats.</p>
  </div>
</div>

<div class="listings-layout container">
  <!-- SIDEBAR FILTERS -->
  <aside class="filters-sidebar" id="filtersSidebar">
    <div class="filters-header">
      <h3>Filter</h3>
      <button class="clear-filters" onclick="clearFilters()">Clear all</button>
    </div>

    <div class="filter-group">
      <label class="filter-label">Property Type</label>
      <div class="filter-checks" id="dynamicTypeChecks">
        <!-- Managed Types Rendered Dynamically -->
      </div>
    </div>

    <div class="filter-group">
      <label class="filter-label">Location</label>
      <select id="locationFilter" onchange="applyFilters()">
        <option value="">All Locations</option>
        <!-- Managed Locations Rendered Dynamically -->
      </select>
    </div>

    <button class="btn-gold" style="width:100%;margin-top:8px" onclick="applyFilters()">Apply Filters</button>
  </aside>

  <!-- MAIN GRID -->
  <main class="listings-main">
    <div class="search-wrapper">
      <div class="search-input-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="keywordSearch" class="listings-search-bar" placeholder="Search by hotel name..." oninput="applyFilters()">
      </div>
    </div>

    <div class="listings-topbar">
      <p id="resultsCount">Loading properties…</p>
      <button class="filter-toggle-btn" id="filterToggle" onclick="toggleFilters()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        Filters
      </button>
    </div>
    
    <div class="prop-grid" id="listingsGrid"></div>
    
    <div class="no-results hidden" id="noResults">
      <div class="no-results-icon">◇</div>
      <h3>No properties found</h3>
      <p>Try adjusting your filters or search keywords</p>
      <button class="btn-outline" onclick="clearFilters()">Clear Filters</button>
    </div>
  </main>
</div>

<script type="module" src="script.js"></script>

<script type="module">
  import { subscribeToAuth } from './src/firebase/auth.js';
  import { subscribeToProperties, subscribeToLocations, subscribeToTypes } from './src/firebase/firestore.js';
  import { escapeHTML } from './src/utils/security.js';

  subscribeToAuth((user) => {
    const adminLink = document.getElementById('adminConsoleLink');
    if (adminLink) adminLink.style.display = (user && user.role === 'admin') ? 'block' : 'none';
  });

  if (typeof updateBadges === 'function') updateBadges();

  window.clearFilters = function() {
    const checkboxes = document.querySelectorAll('.type-check');
    checkboxes.forEach(cb => cb.checked = false);
    
    const locFilter = document.getElementById('locationFilter');
    if (locFilter) locFilter.value = "";
    
    const searchBar = document.getElementById('keywordSearch');
    if (searchBar) searchBar.value = "";
    
    if (typeof applyFilters === 'function') applyFilters();
  };

  // Locations Mapping
  subscribeToLocations((locations) => {
    const locFilter = document.getElementById('locationFilter');
    if (!locFilter) return;
    const currentVal = locFilter.value;
    locFilter.innerHTML = '<option value="">All Locations</option>';
    locations.forEach(doc => {
      const loc = escapeHTML(doc.name);
      const option = document.createElement('option');
      option.value = doc.name;
      option.textContent = loc;
      locFilter.appendChild(option);
    });
    locFilter.value = currentVal;
  });

  // Stay Type Mapping (Filtered strictly to Resort and Villa)
  subscribeToTypes((types) => {
    const container = document.getElementById('dynamicTypeChecks');
    if (!container) return;
    container.innerHTML = '';
    
    const allowedTypes = ['Resort', 'Villa'];
    const filteredTypes = (types || []).filter(t => 
      allowedTypes.some(a => a.toLowerCase() === (t.name || '').trim().toLowerCase())
    );

    const renderList = filteredTypes.length > 0 ? filteredTypes.map(t => t.name) : allowedTypes;

    renderList.forEach(typeName => {
      const safeType = escapeHTML(typeName);
      const labelText = safeType.toLowerCase().endsWith('s') ? safeType : `${safeType}s`;
      container.innerHTML += `<label><input type="checkbox" class="type-check" value="${safeType}" onchange="applyFilters()"> ${labelText}</label>`;
    });
  });

  // Master Sync Execution Stream
  subscribeToProperties((properties) => {
    const publishedProps = properties.filter(p => p.published !== false);
    window.allStaysData = publishedProps;

    const totalProperties = publishedProps.length;
    if (typeof animatePropertyCount === 'function') {
      animatePropertyCount(totalProperties);
    }

    // Read URL Filters
    const urlParams = new URLSearchParams(window.location.search);
    const searchQuery = urlParams.get("search") ? urlParams.get("search").trim() : "";
    const typeParam = urlParams.get("type") ? urlParams.get("type").trim() : "";

    if (searchQuery || typeParam) {
      setTimeout(() => {
        if (searchQuery) {
          const searchBar = document.getElementById("keywordSearch");
          const locFilter = document.getElementById("locationFilter");
          const options = locFilter ? Array.from(locFilter.options) : [];
          const matchedOption = options.find(
            opt => opt.value.toLowerCase() === searchQuery.toLowerCase()
          );

          if (matchedOption) {
            locFilter.value = matchedOption.value;
          } else if (searchBar) {
            searchBar.value = searchQuery;
          }
        }

        if (typeParam) {
          const checks = document.querySelectorAll(".type-check");
          checks.forEach(cb => {
            if (cb.value.toLowerCase() === typeParam.toLowerCase()) {
              cb.checked = true;
            }
          });
        }

        if (typeof applyFilters === "function") {
          applyFilters();
        }
      }, 150);
    } else {
      if (typeof applyFilters === "function") {
        applyFilters();
      }
    }
  });
</script>

<script>
  // ─── LISTINGS PARALLAX SCROLL CONTROLLER ────────────────────
  window.addEventListener('scroll', () => {
    if (window.innerWidth <= 768) return;
    const header = document.getElementById('listingsParallaxHeader');
    if (!header) return;
    
    const rect = header.getBoundingClientRect();
    if (rect.bottom > 0) {
      const offset = window.scrollY * 0.25;
      header.style.backgroundPositionY = `calc(50% + ${offset}px)`;
      const content = header.querySelector('.header-content');
      if (content) {
        content.style.transform = `translateY(${offset * -0.2}px)`;
      }
    }
  }, { passive: true });
</script>
