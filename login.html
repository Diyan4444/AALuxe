<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AALUXE</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Load Google Identity Services Script -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    .login-screen-wrapper {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;

    background:
        linear-gradient(
            rgba(0, 0, 0, 0.48),
            rgba(0, 0, 0, 0.68)
        ),
        url('bg.avif') center center / cover no-repeat;

    font-family: 'Montserrat', sans-serif;
}

.login-modal-box {
    width: min(400px, 100%);
    box-sizing: border-box;

    background: rgba(255, 255, 255, 0.97);

    padding: 38px 36px;

    border-radius: 14px;

    text-align: center;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.28);

    border: 1px solid rgba(197, 168, 128, 0.45);

    position: relative;
    z-index: 2;
}

.login-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 600;
    letter-spacing: 2px;

    color: #111;

    margin-bottom: 8px;
}

.login-logo span {
    color: #c5a880;
}

.login-tagline {
    max-width: 310px;
    margin: 0 auto 28px;

    font-size: 13px;
    line-height: 1.55;

    color: #666;
}

.g_id_signin {
    display: flex;
    justify-content: center;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .login-screen-wrapper {
        align-items: flex-end;

        padding: 0;

        background:
            linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.15) 0%,
                rgba(0, 0, 0, 0.35) 35%,
                rgba(0, 0, 0, 0.65) 100%
            ),
            url('bg.avif') center center / cover no-repeat;
    }

    .login-modal-box {
        width: 100%;
        max-width: none;

        padding: 30px 22px 28px;

        border-radius: 22px 22px 0 0;

        box-shadow:
            0 -10px 40px rgba(0, 0, 0, 0.18);

        border:
            1px solid rgba(197, 168, 128, 0.35);

        border-bottom: none;
    }

    .login-logo {
        font-size: 32px;
        margin-bottom: 6px;
    }

    .login-tagline {
        font-size: 12px;
        line-height: 1.5;

        max-width: 300px;

        margin-bottom: 22px;
    }

    .g_id_signin {
        width: 100%;
    }
}


/* Very small phones */

@media (max-width: 380px) {

    .login-modal-box {
        padding: 24px 18px 22px;
    }

    .login-logo {
        font-size: 29px;
    }

    .login-tagline {
        font-size: 11.5px;
        margin-bottom: 18px;
    }
}
  </style>
</head>
<body>

<div class="login-screen-wrapper">
  <div class="login-modal-box">
    <div class="login-logo"><span>A</span>ALUXE</div>
    <p class="login-tagline">Please sign in to access handpicked luxury stays at unbeatable prices.</p>
    
    <!-- Google Native Identity Configurations -->
    <div id="g_id_onload"
         data-client_id="464814568253-9sektr30qi6q0b3tffs3ojgp3quinfim.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_select="false">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="left">
    </div>
  </div>
</div>

<script>
  function handleCredentialResponse(response) {
    try {
      // Decode the secure JWT payload returned by Google
      const base64Url = response.credential.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));

      const userProfile = JSON.parse(jsonPayload);
      
      // Cache the session data to authorize entry into index.html
      localStorage.setItem('aaluxe_user', JSON.stringify({ 
        name: userProfile.name, 
        email: userProfile.email 
      }));

      // Send data to your terminal outreach log
      console.log(`Lead Captured -> Name: ${userProfile.name}, Email: ${userProfile.email}`);

      // Instantly grant access and push inside the application index layout
      window.location.href = "index.html";

    } catch (error) {
      console.error("Token structural processing error:", error);
    }
  }
</script>
</body>
</html>
