<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AALUXE</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Load Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    .login-screen-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(rgba(0, 0, 0, 0.48), rgba(0, 0, 0, 0.68)),
                  url('bg.avif') center center / cover no-repeat;
      font-family: 'Montserrat', sans-serif;
    }
    .login-modal-box {
      width: min(430px, 100%);
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.97);
      padding: 38px 36px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(197, 168, 128, 0.45);
      position: relative;
      z-index: 2;
    }
    .login-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #111;
      margin-bottom: 8px;
    }
    .login-logo span { color: #c5a880; }
    .login-tagline {
      max-width: 320px;
      margin: 0 auto 24px;
      font-size: 13px;
      line-height: 1.55;
      color: #666;
    }
    .btn-google-auth {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      border: 1px solid #e8dec9;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }
    .btn-google-auth:hover {
      background: #fbf9f6;
      border-color: #c5a880;
    }
    .g_id_signin {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      margin: 18px 0;
      color: #aaa;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e8dec9;
    }
    .auth-divider span { padding: 0 10px; }
    .form-group-auth {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
      text-align: left;
    }
    .form-group-auth label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #777;
    }
    .form-group-auth input {
      padding: 10px 12px;
      border: 1px solid #e8dec9;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    .form-group-auth input:focus { border-color: #c5a880; }
    .error-box {
      margin-top: 15px;
      padding: 12px;
      background: #fdf2f2;
      border: 1px solid #f8b4b4;
      border-radius: 6px;
      font-size: 12px;
      color: #9b1c1c;
      text-align: left;
      line-height: 1.5;
      display: none;
    }
  </style>
</head>
<body>

<div class="login-screen-wrapper">
  <div class="login-modal-box">
    <div class="login-logo"><span>A</span>ALUXE</div>
    <p class="login-tagline">Please sign in to access handpicked luxury stays & exclusive retreats.</p>
    
    <!-- GOOGLE POPUP BUTTON -->
    <button type="button" id="btnGoogleLogin" class="btn-google-auth" style="margin-bottom: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Sign in with Google
    </button>

    <!-- ERROR DIAGNOSTIC BOX -->
    <div id="authErrorBox" class="error-box"></div>
  </div>
</div>

<script type="module">
  import { loginWithGoogle, loginWithGoogleToken, subscribeToAuth } from './src/firebase/auth.js';

  const errorBox = document.getElementById('authErrorBox');

  function handleAuthError(err, providerName = 'Google') {
    console.error("Auth Error:", err);
    errorBox.style.display = 'block';

    const currentDomain = window.location.hostname || 'localhost';
    
    if (err.code === 'auth/unauthorized-domain') {
      errorBox.innerHTML = `
        <strong>Domain Authorization Required in Firebase Console:</strong><br>
        The origin domain (<code>${currentDomain}</code>) is not authorized for Google OAuth in project <em>aaluxe-1627d</em>.<br><br>
        <strong>Fix Steps:</strong><br>
        1. Open <a href="https://console.firebase.google.com/project/aaluxe-1627d/authentication/settings" target="_blank" style="color:#9b1c1c; font-weight:bold;">Firebase Console Auth Settings</a>.<br>
        2. Scroll down to <strong>Authorized domains</strong>.<br>
        3. Click <strong>Add domain</strong> and type: <code>${currentDomain}</code> -> Save.
      `;
    } else if (err.code === 'auth/operation-not-allowed') {
      errorBox.innerHTML = `
        <strong>Google Provider Disabled in Firebase Console:</strong><br>
        The Google Sign-In provider is disabled in your Firebase project.<br><br>
        <strong>Fix Steps:</strong><br>
        1. Open <a href="https://console.firebase.google.com/project/aaluxe-1627d/authentication/providers" target="_blank" style="color:#9b1c1c; font-weight:bold;">Firebase Console Auth Providers</a>.<br>
        2. Click <strong>Sign-in method</strong> tab.<br>
        3. Enable <strong>Google</strong> -> Click Save.
      `;
    } else {
      errorBox.textContent = `Error (${err.code || 'unknown'}): ${err.message || err}`;
    }
  }

  // Redirect if session exists
  subscribeToAuth((user) => {
    if (user) redirectAfterAuth(user.role);
  });

  function redirectAfterAuth(role) {
    if (role === 'admin') window.location.href = 'admin.html';
    else window.location.href = 'index.html';
  }

  // Google Popup Button Handler
  document.getElementById('btnGoogleLogin').addEventListener('click', async () => {
    try {
      const res = await loginWithGoogle();
      redirectAfterAuth(res.role);
    } catch (err) {
      handleAuthError(err, 'Google');
    }
  });
</script>
</body>
</html>
